<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Компоненти</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="redesign-components.css">
</head>

<body>
    <div id="PageContent" class="redesign-components">
        <main class="main remove-safe-gutters">
            <div class="main__wrapper">
                <div class="custom-block custom-block_theme_white container-1770">
                    <div class="custom-block__title">Кнопки (btn_h_36)</div>
                    <div class="redesign-components__btns">
                        <button class="btn btn_h_36 btn_color_light-blue">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M19 12H5M12 5V19" stroke="#295FAF" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            <span>№ закупівлі</span>
                        </button>
                        <button class="btn btn_h_36 btn_color_light-blue" disabled>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M19 12H5M12 5V19" stroke="#295FAF" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            <span>№ закупівлі</span>
                        </button>
                        <button class="btn btn_color_light-green btn_h_36">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M12 15V3M12 15L17 10M12 15L7 10M3 15V19C3 19.5304 3.21071 20.0391 3.58579 20.4142C3.96086 20.7893 4.46957 21 5 21H19C19.5304 21 20.0391 20.7893 20.4142 20.4142C20.7893 20.0391 21 19.5304 21 19V15"
                                    stroke="#28A447" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <span>Завантажити в Excel</span>
                        </button>
                        <button class="btn btn_h_36 btn_color_light-red">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M18 6L6 18M6 6L18 18" stroke="#E65151" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            <span>Очистити фільтри</span>
                        </button>
                        <button class="btn btn_h_36 btn-danger">Видалити</button>
                        <button class="btn btn_h_36 btn-primary">Зупинити</button>
                        <button class="btn btn_h_36 btn-info">Інформація</button>
                        <button class="btn btn_h_36 btn-success">Зберегти</button>
                    </div>
                    <div class="custom-block__title">Кнопки</div>
                    <div class="redesign-components__btns">
                        <button class="btn btn-danger">Видалити</button>
                        <button class="btn btn-primary">Зупинити</button>
                        <button class="btn btn-primary">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M7 7H17M17 7V17M17 7L7 17" stroke="white" stroke-width="3"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <span>Перейти до тендерів</span>
                        </button>
                        <button class="btn btn-info">Інформація</button>
                        <button class="btn btn-success">Зберегти</button>
                        <button class="btn btn_color_white">Реєстрація</button>
                    </div>
                    <div class="custom-block__title">Чіпи</div>
                    <div class="cheked-items">
                        <div class="cheked-items__chip cheked-items__chip_reset" tabindex="0">
                            <svg class="cheked-items__icon" width="19" height="18" viewBox="0 0 19 18" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M14 4.5L5 13.5M5 4.5L14 13.5" stroke="white" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <span class="cheked-items__label">Скинути вибір</span>
                        </div>
                        <div class="cheked-items__chip" tabindex="0">
                            <svg class="cheked-items__icon" width="19" height="18" viewBox="0 0 19 18" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M14 4.5L5 13.5M5 4.5L14 13.5" stroke="#1D437C" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <span class="cheked-items__label">Промислова техніка</span>
                        </div>
                    </div>
                    <div class="custom-block__title">Перемикачі</div>
                    <div class="redesign-components__switches">
                        <div class="custom-control custom-switch custom-control-inline">
                            <input class="custom-control-input" type="checkbox" id="cbFilterInList">
                            <label class="custom-control-label" for="cbFilterInList">Обрані</label>
                        </div>
                        <div class="redesign-components__radio-group">
                            <div class="custom-control custom-radio custom-control-inline">
                                <input type="radio" class="custom-control-input" name="rRegion" id="rRegion_1"
                                    value="1">
                                <label for="rRegion_1" class="custom-control-label">Всі</label>
                            </div>
                            <div class="custom-control custom-radio custom-control-inline">
                                <input type="radio" class="custom-control-input" name="rRegion" id="rRegion_2"
                                    value="2">
                                <label for="rRegion_2" class="custom-control-label">Україна</label>
                            </div>
                        </div>
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="cbConfirm" name="cbConfirm">
                            <label class="custom-control-label" for="cbConfirm">
                                <span>Погоджуюся</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
